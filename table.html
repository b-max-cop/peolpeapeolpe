<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <style type="text/css">
            #line {width: 90%;min-width: 1000px;border-spacing: 4px;table-layout: fixed;}
            #line th,
            #line td {border: 1px solid black;padding: 8px 4px;text-align: center;}
            .egir {background-color:blueviolet}
            .rodos {background-color:lightblue}
        </style>
    </head>
    <body>
        <h3>표 연습</h3>
        <table id="line" border="1">
            <colgroup>
                <col span="15">
            </colgroup>
            <tr>
                <th colspan="2">행과 열</th>
                <td colspan="3">이거 내용</td>
                <td colspan="4">뭐라 쓰지</td>
                <td colspan="6">이거 칸이 왜이리 작아보이지</td>
            </tr>
            <tr class="egir">
                <th colspan="2" rowspan="2">에기르</th>
                <td colspan="3" rowspan="2">스카디 더 커럽팅 하트</td>
                <td>글래디아</td>
                <td colspan="2">울피아누스</td>
                <td colspan="2">마 샤란테</td>
                <td colspan="5">언더플로우</td>
            </tr>
            <tr class="egir">
                <td colspan="2">클레멘티아</td>
                <td>스펙터</td>
                <td colspan="3">스펙터 디 언체인드</td>
                <td colspan="4">스카디</td>
            </tr>
            <tr class="rodos">
                <th colspan="2" rowspan="3">로도스 아일렌드</th>
                <td>박사</td>
                <td>아미야</td>
                <td>켈시</td><td>블레이즈</td><td>로고스</td>
                <td colspan="2">로스몬티스</td>
                <td colspan="2">메커니스트</td>
                <td>미저리</td>
                <td>터치</td>
                <td colspan="2">라이디언</td>
            </tr>
            <tr class="rodos">
                <td>스톰아이</td>
                <td>첸</td>
                <td colspan="3">첸 더 던스트릭</td>
                <td>샤프</td>
                <td colspan="2">만트라</td>
                <td colspan="5">블레이즈 디 이그나이팅 스파크</td>
            </tr>
            <tr class="rodos">
                <td colspan="2">아스카론</td>
                <td colspan="2">Mon3tor</td>
                <td>와파린</td>
                <td>수르트</td>
                <td>쏜즈</td>
                <td>위디</td>
                <td colspan="2">엘리시움</td>
                <td>라바</td>
                <td>클로저</td>
                <td>쿠루스</td>
            </tr>
        </table>
    </body>
</html>
