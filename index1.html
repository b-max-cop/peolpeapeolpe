<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <style type="text/css"> /*외부면 링크*/
            ul {list-style-position: outside;}/*앞으로 한칸*/
            li.usa {list-style-image: circle;}
            li.korea {list-style-type: square}
            #book {width:90%;min-width: 600px; border-spacing: 8px;}
            p {background-color: aqua;}
            p:hover{background-color: yellow; transition: background-color 8s;}
            ul {background-color: brown;}
            li {background-color: blue;}
            td {background-color: aquamarine;}
        </style>
    </head>
    <body>
        <p>10/8</p>
        <p>순서가 없는 목록</p>
        <ul>
            <li class="usa">하나</li>
            <li class="korea">둘</li>
            <li class="usa">셋</li>
        </ul>
        <p>순서가 있는 목록</p>
        <ol>
            <li>첫번째</li>
            <li>두번째</li>
            <li>세번째</li>
        </ol>

        <table border="1" id="book"> <!--표, border 선굴기-->
            <tr><!--첫줄-->
                <th>과목</th>
                <th>책제목</th>
                <th>저자</th>
                <th>출판사</th>
            </tr>
            <tr> 
                <td rowspan="2">웹프로그래밍</td>
                <td>HTML-5</td>
                <td>임순범</td>
                <td>생능</td>
            </tr>
            <tr>
                <td>소셜미디어</td>
                <td>최윤찰</td>
                <td>생능</td>
            </tr>
            <tr>
                <th>합계</th>
                <td colspan="3">2권</td>
            </tr>
        </table>
    </body>
</html>
